name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Dashboards, probe targets and Beyla config match servers.json
        run: |
          python3 infra/grafana/generate.py
          git diff --exit-code -- infra/grafana/dashboards infra/prometheus/targets.json infra/beyla/beyla.yaml \
            || { echo "::error::Run 'python3 infra/grafana/generate.py' and commit the result"; exit 1; }
          # Beyla has no config check of its own; a YAML slip makes it crash-loop on the VPS
          ruby -ryaml -e 'YAML.load_file("infra/beyla/beyla.yaml")'

      - uses: actions/setup-go@v7
        with:
          go-version-file: infra/runner/go.mod
          cache: false
      - name: Runner is formatted, vets and builds
        working-directory: infra/runner
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::Run 'gofmt -w infra/runner'"; exit 1; }
          go vet ./...
          go build ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bench/k6/package-lock.json
      - name: k6 scripts typecheck
        working-directory: bench/k6
        run: |
          npm ci
          npm run typecheck

      - name: Compose file is valid
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/compose.yaml config -q

      - name: Prometheus config is valid
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yaml

      - name: Loki config is valid
        run: |
          docker run --rm -v "$PWD/infra/loki/loki.yaml:/etc/loki/loki.yaml:ro" \
            grafana/loki:3.7.8 -config.file=/etc/loki/loki.yaml -verify-config

      - name: Alloy config is valid
        run: |
          docker run --rm -v "$PWD/infra/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.20.1 validate /etc/alloy/config.alloy

      - name: Tempo config is valid
        run: |
          docker run --rm -v "$PWD/infra/tempo/tempo.yaml:/etc/tempo.yaml:ro" \
            grafana/tempo:3.1.0 -config.file=/etc/tempo.yaml -config.verify=true

      - name: nginx site is valid
        run: |
          docker run --rm -v "$PWD/infra/nginx/o11y.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t

      - name: Shell scripts pass shellcheck
        run: shellcheck -S warning bench/k6/grafana.sh infra/deploy.sh

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: actix, context: servers, file: servers/actix/Dockerfile }
          - { name: axum, context: servers, file: servers/axum/Dockerfile }
          - { name: tokio, context: servers, file: servers/tokio/Dockerfile }
          - { name: go, context: servers, file: servers/go/Dockerfile }
          - { name: gin, context: servers, file: servers/gin/Dockerfile }
          - { name: fiber, context: servers, file: servers/fiber/Dockerfile }
          - { name: fastapi, context: servers, file: servers/fastapi/Dockerfile }
          - { name: flask, context: servers, file: servers/flask/Dockerfile }
          - { name: django, context: servers, file: servers/django/Dockerfile }
          - { name: bun, context: servers, file: servers/bun/Dockerfile }
          - { name: node, context: servers, file: servers/node/Dockerfile }
          - { name: express, context: servers, file: servers/express/Dockerfile }
          - { name: fastify, context: servers, file: servers/fastify/Dockerfile }
          - { name: runner, context: ., file: infra/runner/Dockerfile }
    name: image (${{ matrix.name }})
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: ${{ matrix.name != 'runner' }}
          tags: o11y/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      # Servers that serve the todo API must pass servers/conformance.py; the rest
      # (not ported yet) only need to answer their health check
      - name: Server answers and meets the API contract
        if: matrix.name != 'runner'
        run: |
          port=$(jq -r --arg n "${{ matrix.name }}" '.[] | select(.name == $n) | .port' infra/servers.json)
          docker run -d --name server -p "$port:$port" -e PORT="$port" -e WORKERS=2 "o11y/${{ matrix.name }}:ci"
          base="http://127.0.0.1:$port"
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null "$base/api/v1/health" \
            || { docker logs server; exit 1; }
          if curl -fsS -o /dev/null "$base/api/v1/todos?limit=1"; then
            python3 servers/conformance.py "$base" || { docker logs server | tail -50; exit 1; }
          else
            echo "no todo API yet: health check only"
          fi
      # The VPS pulls these instead of building (infra/deploy.sh); the cache makes this a re-tag and upload
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}

  # Pulls the tested commit on the VPS and runs infra/deploy.sh there.
  # Needs secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS and
  # variable VPS_APP_DIR (the checkout's absolute path) in the production environment.
  # Environment variables are not visible to a job-level `if`, so the check is in the step.
  deploy:
    needs: [checks, images]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://o11y.raashed.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$APP_DIR" || -z "$VPS_HOST" ]]; then
            echo "::error::Set VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS and VPS_APP_DIR in the production environment"
            exit 1
          fi
          # The VPS pulls the images this run pushed. It logs in with this job's token
          # (valid only while the job runs) and logs out again when done.
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e; trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
             docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null
             cd '$APP_DIR' && git fetch --quiet origin main && git reset --hard '${{ github.sha }}'
             IMAGE_REGISTRY='ghcr.io/${{ github.repository }}' IMAGE_TAG='${{ github.sha }}' infra/deploy.sh"

      - name: Public site answers
        run: |
          for path in /api/health /run/; do
            curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "https://o11y.raashed.com$path"
            echo "ok: $path"
          done
