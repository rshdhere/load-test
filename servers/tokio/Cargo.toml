[package]
name = "tokio-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[profile.release]
codegen-units = 1
lto = "fat"
