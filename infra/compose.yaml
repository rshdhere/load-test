name: load-bench

# Servers under test. Each listens on its own port from infra/servers.json, the
# same inside the container and on the host (127.0.0.1 only), so Beyla can tell
# them apart by port and instrument nothing else on the machine.
# Images come from CI (ghcr.io, tagged with the commit) when infra/deploy.sh is
# given IMAGE_REGISTRY and IMAGE_TAG; otherwise they are built here as o11y/<name>:local.
x-server: &server
  restart: unless-stopped
  networks: [o11y]

services:
  actix:
    <<: *server
    build: { context: ../servers, dockerfile: actix/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/actix:${IMAGE_TAG:-local}
    environment: { PORT: "3101", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3101:3101"]
  axum:
    <<: *server
    build: { context: ../servers, dockerfile: axum/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/axum:${IMAGE_TAG:-local}
    environment: { PORT: "3102", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3102:3102"]
  tokio:
    <<: *server
    build: { context: ../servers, dockerfile: tokio/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/tokio:${IMAGE_TAG:-local}
    environment: { PORT: "3103", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3103:3103"]
  go:
    <<: *server
    build: { context: ../servers, dockerfile: go/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/go:${IMAGE_TAG:-local}
    environment: { PORT: "3104", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3104:3104"]
  gin:
    <<: *server
    build: { context: ../servers, dockerfile: gin/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/gin:${IMAGE_TAG:-local}
    environment: { PORT: "3105", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3105:3105"]
  fiber:
    <<: *server
    build: { context: ../servers, dockerfile: fiber/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/fiber:${IMAGE_TAG:-local}
    environment: { PORT: "3106", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3106:3106"]
  fastapi:
    <<: *server
    build: { context: ../servers, dockerfile: fastapi/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/fastapi:${IMAGE_TAG:-local}
    environment: { PORT: "3107", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3107:3107"]
  flask:
    <<: *server
    build: { context: ../servers, dockerfile: flask/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/flask:${IMAGE_TAG:-local}
    environment: { PORT: "3108", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3108:3108"]
  django:
    <<: *server
    build: { context: ../servers, dockerfile: django/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/django:${IMAGE_TAG:-local}
    environment: { PORT: "3109", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3109:3109"]
  bun:
    <<: *server
    build: { context: ../servers, dockerfile: bun/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/bun:${IMAGE_TAG:-local}
    environment: { PORT: "3110", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3110:3110"]
  node:
    <<: *server
    build: { context: ../servers, dockerfile: node/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/node:${IMAGE_TAG:-local}
    environment: { PORT: "3111", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3111:3111"]
  express:
    <<: *server
    build: { context: ../servers, dockerfile: express/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/express:${IMAGE_TAG:-local}
    environment: { PORT: "3112", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3112:3112"]
  fastify:
    <<: *server
    build: { context: ../servers, dockerfile: fastify/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/fastify:${IMAGE_TAG:-local}
    environment: { PORT: "3113", WORKERS: "${WORKERS:-2}" }
    ports: ["127.0.0.1:3113:3113"]

  # Observability stack
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [o11y]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SERVER_ROOT_URL: ${O11Y_URL:-http://localhost:3120}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/.env}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/Fleet/fleet.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Read by the notification provisioning that infra/deploy.sh writes when it is set
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports: ["127.0.0.1:3120:3001"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [o11y]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=advtcp,cpuset,cpu_topology,disk,diskIO,hugetlb,memory_numa,percpu,perf_event,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [o11y]
    restart: unless-stopped

  # Host network so it reports the real machine's network and TCP state; it
  # binds to the o11y bridge gateway, which only containers on that network reach.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.30.0.1:9100
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox/blackbox.yaml"]
    volumes:
      - ./blackbox:/etc/blackbox:ro
    networks: [o11y]
    restart: unless-stopped

  # Logs: Alloy tails this project's containers and ships them to Loki
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [o11y]
    mem_limit: 384m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy",
              "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    networks: [o11y]
    mem_limit: 256m
    # Retries pushes until Loki is ready (the Loki image has no shell tools for a healthcheck)
    depends_on: [loki]
    restart: unless-stopped

  # Traces: Beyla's server spans and the runner's own spans, over OTLP
  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [o11y]
    mem_limit: 512m
    restart: unless-stopped

  # eBPF auto-instrumentation of the servers (no code changes, any language):
  # RED metrics for every request and sampled traces. It needs the host's PID
  # namespace and privileges to load eBPF programs; infra/beyla/beyla.yaml limits
  # it to the servers' ports.
  beyla:
    image: grafana/beyla:3.37.0
    environment:
      BEYLA_CONFIG_PATH: /etc/beyla/beyla.yaml
    volumes:
      - ./beyla/beyla.yaml:/etc/beyla/beyla.yaml:ro
    pid: host
    privileged: true
    networks: [o11y]
    mem_limit: 384m
    restart: unless-stopped

  # Lets visitors start one load test at a time; the host's nginx proxies /run/ to it
  runner:
    build: { context: .., dockerfile: infra/runner/Dockerfile }
    image: ${IMAGE_REGISTRY:-o11y}/runner:${IMAGE_TAG:-local}
    environment:
      # The menus visitors pick a test from, and the budget across all servers in one test
      RUNNER_RATES: ${RUNNER_RATES:-100,250,500,1000,2000}
      RUNNER_DURATIONS: ${RUNNER_DURATIONS:-15s,30s,60s}
      RUNNER_MAX_TOTAL_RATE: ${RUNNER_MAX_TOTAL_RATE:-2000}
      RUNNER_RATE: ${RUNNER_RATE:-500}
      RUNNER_DURATION: ${RUNNER_DURATION:-30s}
      RUNNER_COOLDOWN: ${RUNNER_COOLDOWN:-60s}
      RUNNER_PER_IP_HOURLY: ${RUNNER_PER_IP_HOURLY:-3}
      # Set by infra/deploy.sh; shown on the dashboards as the deployed commit and as deploy markers
      GIT_COMMIT: ${GIT_COMMIT:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    volumes:
      - ./servers.json:/etc/runner/servers.json:ro
      - runner-results:/results
    ports: ["127.0.0.1:3121:8080"]
    networks: [o11y]
    # k6 runs in here; a big visitor test fails on its own rather than starving the machine
    mem_limit: 768m
    restart: unless-stopped

networks:
  o11y:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  prometheus-data:
  grafana-data:
  runner-results:
  loki-data:
  tempo-data:
  alloy-data:
