name: load-bench

# Servers under test. Each listens on 3000 inside its container and is published
# on 127.0.0.1 only; infra/servers.json lists the host ports.
x-server: &server
  restart: unless-stopped
  environment:
    PORT: "3000"
    WORKERS: ${WORKERS:-2}
  networks: [o11y]

services:
  actix:
    <<: *server
    build: { context: ../servers, dockerfile: actix/Dockerfile }
    image: o11y/actix:local
    ports: ["127.0.0.1:3101:3000"]
  axum:
    <<: *server
    build: { context: ../servers, dockerfile: axum/Dockerfile }
    image: o11y/axum:local
    ports: ["127.0.0.1:3102:3000"]
  tokio:
    <<: *server
    build: { context: ../servers, dockerfile: tokio/Dockerfile }
    image: o11y/tokio:local
    ports: ["127.0.0.1:3103:3000"]
  go:
    <<: *server
    build: { context: ../servers, dockerfile: go/Dockerfile }
    image: o11y/go:local
    ports: ["127.0.0.1:3104:3000"]
  gin:
    <<: *server
    build: { context: ../servers, dockerfile: gin/Dockerfile }
    image: o11y/gin:local
    ports: ["127.0.0.1:3105:3000"]
  fiber:
    <<: *server
    build: { context: ../servers, dockerfile: fiber/Dockerfile }
    image: o11y/fiber:local
    ports: ["127.0.0.1:3106:3000"]
  fastapi:
    <<: *server
    build: { context: ../servers, dockerfile: fastapi/Dockerfile }
    image: o11y/fastapi:local
    ports: ["127.0.0.1:3107:3000"]
  flask:
    <<: *server
    build: { context: ../servers, dockerfile: flask/Dockerfile }
    image: o11y/flask:local
    ports: ["127.0.0.1:3108:3000"]
  django:
    <<: *server
    build: { context: ../servers, dockerfile: django/Dockerfile }
    image: o11y/django:local
    ports: ["127.0.0.1:3109:3000"]
  bun:
    <<: *server
    build: { context: ../servers, dockerfile: bun/Dockerfile }
    image: o11y/bun:local
    ports: ["127.0.0.1:3110:3000"]
  node:
    <<: *server
    build: { context: ../servers, dockerfile: node/Dockerfile }
    image: o11y/node:local
    ports: ["127.0.0.1:3111:3000"]
  express:
    <<: *server
    build: { context: ../servers, dockerfile: express/Dockerfile }
    image: o11y/express:local
    ports: ["127.0.0.1:3112:3000"]
  fastify:
    <<: *server
    build: { context: ../servers, dockerfile: fastify/Dockerfile }
    image: o11y/fastify:local
    ports: ["127.0.0.1:3113:3000"]

  # Observability stack
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [o11y]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SERVER_ROOT_URL: ${O11Y_URL:-http://localhost:3120}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/.env}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/Fleet/fleet.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports: ["127.0.0.1:3120:3001"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [o11y]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=advtcp,cpuset,cpu_topology,disk,diskIO,hugetlb,memory_numa,percpu,perf_event,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [o11y]
    restart: unless-stopped

  # Host network so it reports the real machine's network and TCP state; it
  # binds to the o11y bridge gateway, which only containers on that network reach.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.30.0.1:9100
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox/blackbox.yaml"]
    volumes:
      - ./blackbox:/etc/blackbox:ro
    networks: [o11y]
    restart: unless-stopped

  # Lets visitors start one load test at a time; the host's nginx proxies /run/ to it
  runner:
    build: { context: .., dockerfile: infra/runner/Dockerfile }
    image: o11y/runner:local
    environment:
      RUNNER_SCRIPT: ${RUNNER_SCRIPT:-load}
      RUNNER_RATE: ${RUNNER_RATE:-500}
      RUNNER_DURATION: ${RUNNER_DURATION:-30s}
      RUNNER_COOLDOWN: ${RUNNER_COOLDOWN:-60s}
      RUNNER_PER_IP_HOURLY: ${RUNNER_PER_IP_HOURLY:-3}
    volumes:
      - ./servers.json:/etc/runner/servers.json:ro
      - runner-results:/results
    ports: ["127.0.0.1:3121:8080"]
    networks: [o11y]
    restart: unless-stopped

networks:
  o11y:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  prometheus-data:
  grafana-data:
  runner-results:
