apiVersion: 1

groups:
  - orgId: 1
    name: o11y
    folder: Fleet
    interval: 10s
    rules:
      - uid: load-error-rate
        title: High error rate during load test
        condition: C
        for: 20s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.testid }}: {{ if $values.B.Value }}{{ humanizePercentage $values.B.Value }}{{ else }}over 2%{{ end }} of requests are failing"
          description: More than 2% of requests failed over the last 30s, which also fails the break test threshold.
        labels:
          severity: critical
          kind: load-test  # shown on dashboards, not sent as notifications
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (testid, server) (rate(k6_http_reqs_total{expected_response="false",group!~"::setup|::teardown"}[30s]))
                or sum by (testid, server) (rate(k6_http_reqs_total{group!~"::setup|::teardown"}[30s])) * 0)
                / sum by (testid, server) (rate(k6_http_reqs_total{group!~"::setup|::teardown"}[30s]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0.02] } }]

      - uid: load-p99-latency
        title: High p99 latency during load test
        condition: C
        for: 30s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.testid }}: p99 latency is {{ if $values.B.Value }}{{ humanizeDuration $values.B.Value }}{{ else }}above 500ms{{ end }}"
          description: The median of 1s-window p99 latency over the last 30s is above 500 ms.
        labels:
          severity: warning
          kind: load-test  # shown on dashboards, not sent as notifications
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                quantile_over_time(0.5,
                (max by (testid, server) (k6_http_req_duration_p99{group!~"::setup|::teardown"}))[30s:1s])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0.5] } }]

      - uid: load-accept-overflow
        title: Server accept queue overflowing
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "The kernel is dropping {{ if $values.B.Value }}{{ humanize $values.B.Value }}{{ else }}some{{ end }} connections/s"
          description: The server's listen backlog is full, so new connections are being refused before the server sees them.
        labels:
          severity: warning
          kind: load-test  # shown on dashboards, not sent as notifications
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: rate(node_netstat_TcpExt_ListenOverflows[30s])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: server-down
        title: Server is down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "{{ $labels.server }} has failed its health check for over a minute"
          description: The blackbox probe of /api/v1/health is failing; check the container logs with `docker compose logs {{ $labels.server }}`.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (server) (probe_success{job="server-health"})
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]

  # Production health: SLO burn, the public site, TLS, disk and memory.
  # The SLO rules read server:probe_success:ratio_1m from infra/prometheus/recording.yaml.
  - orgId: 1
    name: platform
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: slo-fast-burn
        title: Error budget burning fast
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.server }} is spending its 30-day error budget {{ if $values.B.Value }}{{ humanize $values.B.Value }}x{{ else }}over 14.4x{{ end }} faster than sustainable"
          description: Over both the last hour and the last 5 minutes, health checks failed often enough to spend 2% of the 30-day budget per hour (the standard fast-burn page).
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (1 - avg by (server) (avg_over_time(server:probe_success:ratio_1m[1h]))) / 0.001
                and on (server)
                (1 - avg by (server) (avg_over_time(probe_success{job="server-health"}[5m]))) / 0.001 > 14.4
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [14.4] } }]

      - uid: public-site-down
        title: Public site is down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "https://o11y.raashed.com has not answered for 2 minutes"
          description: The blackbox probe through nginx and TLS is failing. Check `systemctl status nginx` and the Grafana container.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                probe_success{job="public-endpoint"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      - uid: tls-expiring
        title: TLS certificate expiring
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "The o11y.raashed.com certificate expires in {{ if $values.B.Value }}{{ humanize $values.B.Value }}{{ else }}under 14{{ end }} days"
          description: certbot normally renews 30 days ahead, so renewal is failing. Run `sudo certbot renew --dry-run` on the VPS.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (probe_ssl_earliest_cert_expiry{job="public-endpoint"} - time()) / 86400
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [14] } }]

      - uid: disk-filling
        title: Disk will fill within a day
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "At the current rate the host's disk fills within 24 hours"
          description: Free space is falling fast enough to run out within a day. Check Prometheus retention and `docker system df`.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                min(predict_linear(node_filesystem_avail_bytes{job="host",fstype=~"ext4|xfs|btrfs|zfs"}[6h], 86400))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [0] } }]

      - uid: container-oom
        title: Container ran out of memory
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.container_label_com_docker_compose_service }} had a process killed for running out of memory"
          description: The kernel OOM-killed a process in this container in the last 5 minutes.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                sum by (container_label_com_docker_compose_service) (increase(container_oom_events_total{container_label_com_docker_compose_service!=""}[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: server-5xx
        title: Server answering with errors
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.service_name }} answered {{ if $values.B.Value }}{{ humanizePercentage $values.B.Value }}{{ else }}over 5%{{ end }} of requests with a 5xx"
          description: Measured inside the server by Beyla (eBPF), so it counts every request, not only k6's. Usually a server overwhelmed by a load test.
        labels:
          severity: warning
          kind: load-test  # shown on dashboards, not sent as notifications
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[2m]))
                / sum by (service_name) (rate(http_server_request_duration_seconds_count[2m])))
                and on (service_name) sum by (service_name) (rate(http_server_request_duration_seconds_count[2m])) > 1
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]
