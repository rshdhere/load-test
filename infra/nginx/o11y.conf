# Site for the host's nginx: Grafana at /, the load-test runner at /run/.
# Install it on the VPS (see infra/README.md), then let certbot add HTTPS:
#   sudo cp infra/nginx/o11y.conf /etc/nginx/conf.d/o11y.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d o11y.raashed.com

map $http_upgrade $o11y_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name o11y.raashed.com;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    # Keep the port: the runner compares Origin with Host to reject cross-site posts
    proxy_set_header Host $http_host;
    # Overwrite rather than append: the runner's per-visitor limit trusts the first address
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Grafana Live streams dashboard updates over a websocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $o11y_connection_upgrade;

    # Prometheus scrapes these on the internal network; keep them off the internet
    location = /metrics {
        return 404;
    }

    # Visitor-started load tests
    location /run/ {
        proxy_pass http://127.0.0.1:3121;
    }

    location / {
        proxy_pass http://127.0.0.1:3120;
    }
}
