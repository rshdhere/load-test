global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/recording.yaml]

# k6 pushes load-test metrics via remote write; everything below is pulled.
scrape_configs:
  # Health of every server, probed through blackbox_exporter. targets.json is
  # generated from infra/servers.json by infra/grafana/generate.py.
  - job_name: server-health
    scrape_interval: 5s
    metrics_path: /probe
    params:
      module: [health]
    file_sd_configs:
      - files: [/etc/prometheus/targets.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # The public site as visitors reach it, through the host's nginx and TLS.
  # Also reports when the certificate expires.
  - job_name: public-endpoint
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [public]
    static_configs:
      - targets: ["https://o11y.raashed.com/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: containers
    scrape_interval: 5s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: host
    scrape_interval: 5s
    static_configs:
      - targets: ["172.30.0.1:9100"]
        labels:
          instance: o11y-host

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3001"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  - job_name: runner
    scrape_interval: 5s
    static_configs:
      - targets: ["runner:8080"]

  # Request metrics from inside every server, recorded by Beyla through eBPF
  - job_name: beyla
    scrape_interval: 5s
    static_configs:
      - targets: ["beyla:9400"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
